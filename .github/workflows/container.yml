# Container build, scan, smoke, and push (STEP-06 W6).
#
# Pushes ghcr.io/mohdsaifhussain/finding-bridge:<sha> and :latest. The
# package stays PRIVATE on GHCR until the director's flip (W8); the v1.0.0
# tag waits for the flip too. The only credential is the workflow's own
# GITHUB_TOKEN with packages:write; no repository secret exists or is needed.
#
# Actions pinned to full-length commit SHAs (GitHub security hardening guide,
# fetched 2026-08-25). The base image is digest-pinned in the Dockerfile.
# Rehearsed locally on 2026-08-25 before the first push
# (evidence/w6-local-rehearsal.md); this run is the second half of the
# measured-not-remembered pair for the base digest.

name: container

on:
  push:
    branches: [master]
    # STEP-07 P3: a release tag v* also publishes :X.Y.Z, so the next
    # release's version tag comes from the workflow, not a hand re-tag
    # (v1.0.0's :1.0.0 was hand re-tagged, D-086 F5). A plain branch push
    # produces :sha and :latest only.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mohdsaifhussain/finding-bridge

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build (local load, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:candidate

      # DIGEST READ-BACK (D-077): the pin in the Dockerfile is the remembered
      # half; the digest of the base image THIS RUNNER pulled is the measured
      # half. They must match, and the run log is the evidence.
      #
      # THE VERSION IS NOT WRITTEN INTO THIS STEP (D-092). It was, twice, and
      # when Dependabot moved the base from 3.12-slim to 3.14-slim the grep
      # matched nothing, `pin` went empty, and `docker pull ""` failed with
      # "invalid reference format" instead of the guard firing. The old guard
      # could not fail for that case: `echo "" | wc -l` is 1, so the one-pin
      # check passed on an empty pin. Each failure mode below now refuses with
      # its own reason code (rule 5).
      - name: Read the base digest back from the pulled image and compare to the pin
        run: |
          pin=$(grep -oE 'python:[0-9]+\.[0-9]+-slim@sha256:[0-9a-f]{64}' Dockerfile | sort -u)
          if [ -z "$pin" ]; then
            echo "pin-not-found: no digest-pinned python:<x.y>-slim base in Dockerfile"
            exit 1
          fi
          if [ "$(printf '%s\n' "$pin" | wc -l)" != "1" ]; then
            echo "pin-not-unique: the two stages do not share one base pin"
            printf '%s\n' "$pin"
            exit 1
          fi
          echo "pinned:   $pin"
          docker pull -q "$pin" > /dev/null
          got=$(docker image inspect "$pin" --format '{{ index .RepoDigests 0 }}')
          echo "pulled:   $got"
          if [ "python@${pin#*@}" != "$got" ]; then
            echo "digest-mismatch: the pulled digest does not match the pin"
            exit 1
          fi
          echo "digest read-back matches the pin"

      # LAYER SCAN (tools/layer_scan.py): the key is never in the image.
      # Order, by rule 5: the scanner's selftest (a planted keyring must be
      # found), then a real docker-save positive control (a planted key file
      # in a throwaway image), then the candidate.
      - name: Layer scan, selftest and positive control
        run: |
          python3 tools/layer_scan.py --selftest
          mkdir -p /tmp/planted && cd /tmp/planted
          printf 'FROM scratch\nCOPY fb.key /fb.key\n' > Dockerfile
          printf '{"keyring_version": 1, "ref_key": "%s", "encryption_keys": ["%s"]}\n' "$(head -c 32 /dev/urandom | base64 | tr '+/' '-_')" "$(head -c 32 /dev/urandom | base64 | tr '+/' '-_')" > fb.key
          docker build -q -t planted:control . > /dev/null
          docker save planted:control -o /tmp/planted.tar
          if python3 "${GITHUB_WORKSPACE}/tools/layer_scan.py" /tmp/planted.tar; then echo "SCAN BLIND: planted key not found"; exit 1; fi
          echo "positive control: planted key found (scanner exit 1 as required)"

      - name: Layer scan, candidate image
        run: |
          docker save "${IMAGE}:candidate" -o /tmp/image.tar
          python3 tools/layer_scan.py /tmp/image.tar

      # SMOKE ROW: the real pipeline in the container, key and gitconfig
      # mounted from outside (F-8: the human gate needs git for identity),
      # and the sealed sentinel must never reach stdout across
      # ingest / list / confirm / verify / emit / refused unseal.
      - name: Smoke (mounted key and gitconfig; no sealed sentinel on stdout)
        run: |
          set -e
          mkdir -p /tmp/smoke/store /tmp/smoke/key /tmp/smoke/in
          cp schemas/fixtures/garak.synthetic.hitlog.jsonl /tmp/smoke/in/
          printf '[user]\n\tname = smoke-operator\n\temail = smoke@example.invalid\n' > /tmp/smoke/gitconfig
          chmod -R a+rwX /tmp/smoke
          run() { docker run --rm -v /tmp/smoke/store:/work/store -v /tmp/smoke/key:/home/fb/key -v /tmp/smoke/in:/work/in:ro -v /tmp/smoke/gitconfig:/home/fb/.gitconfig:ro "${IMAGE}:candidate" --store /work/store --key /home/fb/key/fb.key "$@"; }
          run ingest-garak in/garak.synthetic.hitlog.jsonl | tee /tmp/smoke/out.txt
          id=$(run list | tee -a /tmp/smoke/out.txt | grep -o 'fb-[0-9a-f]\{16\}' | head -1)
          run confirm "$id" | tee -a /tmp/smoke/out.txt
          run verify | tee -a /tmp/smoke/out.txt
          run emit-markdown store/packet.md | tee -a /tmp/smoke/out.txt
          ref=$(grep -o 'response sealed/[0-9a-f]*' /tmp/smoke/store/packet.md | cut -d' ' -f2)
          run unseal "$ref" 2>&1 | tee -a /tmp/smoke/out.txt || true
          if grep -q "SENTINEL-HARM" /tmp/smoke/out.txt; then echo "SEALED SENTINEL ON STDOUT"; exit 1; fi
          grep -q "sealed content" /tmp/smoke/out.txt
          grep -q "unseal-not-explicit" /tmp/smoke/out.txt
          test -f /tmp/smoke/key/fb.key && echo "key was created OUTSIDE the image, in the mounted folder"
          # the positive direction, NOT captured into out.txt: an explicit unseal returns the sentinel,
          # proving the content was present and sealed rather than absent.
          run unseal "$ref" --explicit | grep -q "SENTINEL-HARM-7001" && echo "explicit unseal returned the sealed sentinel"

      - name: Log in to GHCR (GITHUB_TOKEN only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tag list (:sha and :latest; plus :X.Y.Z on a v* tag push)
        id: tags
        run: |
          tags="${IMAGE}:${{ github.sha }},${IMAGE}:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"
            tags="${tags},${IMAGE}:${v}"
            echo "release tag push: adding :${v}"
          else
            echo "branch push: :sha and :latest only"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Push the computed tags
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
