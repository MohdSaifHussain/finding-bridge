# D-027 AUDIT, full-core close audit of STEP-02 (D-029: scope change states
# both denominators). Reproduce:
#   cosmic-ray init cr-dedup.toml cr-dedup.sqlite && cosmic-ray exec cr-dedup.toml cr-dedup.sqlite && cr-report cr-dedup.sqlite
[cosmic-ray]
module-path = "src/finding_bridge/core/dedup.py"
timeout = 90.0
excluded-modules = []
test-command = "python -m pytest -x -q -p no:cacheprovider tests"

[cosmic-ray.distributor]
name = "local"
