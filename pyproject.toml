[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-bridge"
version = "0.1.0"
description = "Universal local-first adapter turning AI red-team tool output into standardized, sealed, provenance-stamped findings"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26",
    "rfc3339-validator>=0.1.4",
    "cryptography>=43",
]

[project.scripts]
fb = "finding_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
