[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-bridge"
version = "0.1.0"
description = "Universal local-first adapter turning AI red-team tool output into standardized, sealed, provenance-stamped findings"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.26",
    "rfc3339-validator>=0.1.4",
    "cryptography>=43",
    "rfc8785==0.1.4",
]

[project.scripts]
finding-bridge = "finding_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6.165",
]
audit = [
    "cosmic-ray>=8.7",
]
# OPTIONAL by ruling: the package installs and the whole suite runs
# without it. Only the --ai flag needs it.
ai = [
    "anthropic==1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finding_bridge.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
